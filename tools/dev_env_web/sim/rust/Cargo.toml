# Self-contained: not a member of the root MCU Rust workspace at
# /Cargo.toml. This crate targets wasm32 and the host, not Cortex-M/RISC-V.
[workspace]

[package]
name = "tiny_vm_sim"
version = "0.1.0"
edition = "2021"
description = "WebAssembly tiny_vm simulator — Rust port of tools/dev_env/sim/tiny_vm_sim.py"
license = "MIT OR Apache-2.0"
publish = false

[lib]
# cdylib for wasm output, rlib so `cargo test` can link the crate natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
# wasm-bindgen is only used when compiling for wasm.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
# Optimise for size — this is a browser bundle.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# wasm-pack's bundled wasm-opt does not enable bulk-memory by default, but
# the Rust 1.95 compiler emits memory.copy. Pass --enable-bulk-memory through
# so the post-build optimiser does not reject the output.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory"]
