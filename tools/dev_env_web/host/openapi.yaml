openapi: 3.0.3
info:
  title: tiny_vm backend API
  version: "0.1.0"
  description: |
    Wire contract for the tiny_vm IDE's backend services. In dev this is
    served by `tools/dev_env_web/host/compile-server.mjs`. In production
    the same contract is intended to be implemented by a Spring Boot
    service generated from this spec (`openapi-generator-cli generate -g
    spring`).

    All endpoints scope to the calling user. v1 has no authentication;
    every request is treated as belonging to a single anonymous user.
    When auth lands, no path or schema changes are required — the
    server simply filters by the authenticated owner.

servers:
  - url: http://localhost:3001
    description: dev sidecar (Node)

paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Liveness probe.
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/compile:
    post:
      operationId: compile
      summary: Compile a .cvm.c source to bytecode + source map.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompileRequest"
      responses:
        "200":
          description: Compiled artifacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/projects:
    get:
      operationId: listProjects
      summary: List projects owned by the current user.
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
    post:
      operationId: createProject
      summary: Create a new project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 200 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      operationId: getProject
      summary: Project metadata.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProject
      summary: Delete a project and all its files.
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/projects/{projectId}/files:
    parameters:
      - $ref: "#/components/parameters/projectId"
    get:
      operationId: listFiles
      summary: Recursive file tree for a project.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/FileEntry" }
        "404":
          $ref: "#/components/responses/NotFound"

  /api/projects/{projectId}/files/{path}:
    parameters:
      - $ref: "#/components/parameters/projectId"
      - in: path
        name: path
        required: true
        schema:
          type: string
        description: |
          POSIX-style path relative to the project root. Components
          containing `..` are rejected.
    get:
      operationId: readFile
      summary: Read file contents (binary).
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: writeFile
      summary: Write file contents (binary). Creates parents.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileEntry" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteFile
      summary: Delete a file.
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    projectId:
      in: path
      name: projectId
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Health:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        repoRoot: { type: string }

    Project:
      type: object
      required: [id, name, createdAt, modifiedAt]
      properties:
        id:         { type: string, format: uuid }
        name:       { type: string }
        createdAt:  { type: string, format: date-time }
        modifiedAt: { type: string, format: date-time }

    FileEntry:
      type: object
      required: [path, type, size, modifiedAt]
      properties:
        path:       { type: string,  description: POSIX path under the project root }
        type:       { type: string,  enum: [file, directory] }
        size:       { type: integer, description: bytes; 0 for directories }
        modifiedAt: { type: string,  format: date-time }

    CompileRequest:
      type: object
      required: [source]
      properties:
        source: { type: string, description: .cvm.c source text }
        name:   { type: string, description: display name for source-map }

    CompileResponse:
      type: object
      required: [bytecodeBase64, sourceMap]
      properties:
        bytecodeBase64: { type: string, format: byte }
        sourceMap:
          description: vm_cc.py --map output as parsed JSON
          oneOf:
            - type: object
            - type: "null"
        assembly:
          oneOf:
            - type: string
            - type: "null"

    Error:
      type: object
      required: [error]
      properties:
        error:  { type: string }
        detail: { type: string }
